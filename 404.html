<!DOCTYPE html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Síða fannst ekki — Iceland Compass</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .nf-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px;
      }
      .nf-compass { width: 84px; height: 84px; margin-bottom: 28px; animation: nf-spin 14s linear infinite; }
      @keyframes nf-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .nf-compass { animation: none; } }
      .nf-code {
        font-family: var(--font-display);
        font-size: 1rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-bottom: 10px;
      }
      .nf-wrap h1 { font-size: clamp(1.9rem, 5vw, 3rem); margin-bottom: 14px; }
      .nf-wrap p { color: var(--ink-soft); max-width: 480px; margin-bottom: 8px; }
      .nf-en { font-size: 0.92rem; color: var(--ink-faint); }
      .nf-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 30px; }
    </style>
  </head>
  <body>
    <div class="nf-wrap">
      <svg class="nf-compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="#1f4e46"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#f4f1ea" stroke-width="2.5" opacity="0.55"/>
        <polygon points="50,14 58,50 50,50 42,50" fill="#f4f1ea"/>
        <polygon points="50,86 42,50 50,50 58,50" fill="#b05750"/>
        <circle cx="50" cy="50" r="5.5" fill="#f4f1ea"/>
        <circle cx="50" cy="50" r="2.6" fill="#1f4e46"/>
      </svg>
      <p class="nf-code">404</p>
      <h1>Þessi slóð er utan kortsins</h1>
      <p>Síðan sem þú leitaðir að er ekki til — kannski hefur hún færst, eða áttavitinn snúist aðeins of langt.</p>
      <p class="nf-en">This page doesn't exist — let's get you back on the map.</p>
      <div class="nf-actions">
        <a href="/" class="btn btn-primary">Á forsíðuna</a>
        <a href="/leidir/" class="btn btn-ghost">Skoða ferðaleiðir</a>
        <a href="/en/" class="btn btn-ghost">English</a>
      </div>
    </div>
  </body>
</html>
