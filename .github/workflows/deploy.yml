name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # MIKILVÆGT: SiteGround FTP-rótin er heimasvæði hýsingar, EKKI docroot.
          server-dir: icelandcompass.com/public_html/
          # Ekki hlaða upp þróunarskrám / VCS
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            build.py
            *.md
            *.json
            scratchpad/**
            brand/**
            **/.DS_Store
